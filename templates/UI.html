<!DOCTYPE html>
<html>
     <head>
     <title>CC Chatbot</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <style>
    body{
      margin:0;
      background-color:white;
    }
    .chat-container{
      display:flex;
      flex-direction:column;
      height:100vh;
      justify-content:space-between;
    }
      .chat-area{
      display:flex;   
      flex-direction:column;
      overflow-y:auto;    
      padding:10px;
      flex:1;
      
    }
    .welcome-text{
      text-align:center;
        margin:auto;

    }
    .welcome-text h1{
      font-size:40px;
      margin:auto;
    }
    .welcome-text p{
      font-size:20px;
      color:gray;
    }
    .message{
        display:flex;
        flex-direction:column;
        box-sizing: border-box;
        width: 100%;
          }
    .input-area{
      background-color:white;
      padding:20px;
      display:flex;
      border-top:1px solid #ccc;
    }
   .search-bar{
      flex:1;
      background:white;
      border:1px solid #ccc;
      border-radius:10px;
      height:30px;
      padding-left:10px;
      cursor:pointer;
   }
   .send-bar{
      background-color:black;
      padding:12px 20px;
      margin-left:10px;
      color:white;
      border-radius:10px;
      border:none;
      cursor:pointer;
   }
      </style>  
     </head>
     <body>
      <div class="chat-container">
          <div class="chat-area">
              <div class="welcome-text">
                <h1>WELCOME TO CC Chatbot</h1>
                <p>what can i help with?</p>
              </div>
              <div class="message"></div>
          </div>
          
          <div class="input-area">
              <input class="search-bar" type="text" placeholder="what's your interest???????">
              <button class="send-bar">send</button>
          </div>
      </div>
         <script src="/static/Script.js"></script>
        </body>
</html>
